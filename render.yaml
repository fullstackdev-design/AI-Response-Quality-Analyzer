services:
  - type: web
    name: gal-backend
   # Build from server/Dockerfile
    env: docker
    rootDir: server
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gal-db
          property: connectionString
    # Optional scaling
    # numInstances: 1
    # region: oregon

  - type: web
    name: gal-frontend
    env: docker
    rootDir: frontend
    plan: free
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: gal-db
    plan: free
