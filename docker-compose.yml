version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: galuser
      POSTGRES_PASSWORD: galpass
      POSTGRES_DB: galdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://galuser:galpass@db:5432/galdb
      JWT_SECRET: change_me_prod
      PORT: 4000
    depends_on:
      - db
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  db-data:
